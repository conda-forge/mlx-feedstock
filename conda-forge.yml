bot:
  automerge: true
  inspection: update-grayskull
build_platform:
  osx_arm64: osx_64
conda_build:
  error_overlinking: true
conda_forge_output_validation: true
# TEST ONLY -- revert before merging.  osx-arm64 pulls the unreleased
# conda-forge-ci-setup (conda-forge/conda-forge-ci-setup-feedstock#443) from the
# mark.harfouche channel via a hand edit of .scripts/run_osx_build.sh after
# re-rendering (remote_ci_setup has no platform selectors and linux must keep
# conda-forge's build).  pixi cannot express a channel there, hence conda
# (mamba 2.x rejects the --update-specs flag the generated scripts pass).
conda_install_tool: conda
conda_build_tool: rattler-build
github:
  branch_name: main
  tooling_branch_name: main
provider:
  linux_aarch64: default
  # osx-arm64 moves off Azure so each SDK tier can pick its own runner image via
  # github_actions_labels in recipe/conda_build_config.yaml.  The macOS 26 tier
  # needs to build on a macOS 26 host: stdlib("c") pulls in
  # macosx_deployment_target 26.0, whose strong run_exports puts `__osx >=26.0`
  # into the *host* environment, which cannot be solved on Azure's macOS 15
  # agents.  Azure only offers macOS 26 as an Intel-only public preview, whereas
  # GitHub's macos-26 runner is arm64 and ships Xcode 26.x.  The macOS 27 tier
  # likewise needs GitHub's xcode-27 image, which runs macOS 27 with Xcode 27.
  #
  # Keyed on osx_64, not osx_arm64: conda-smithy resolves a target's CI provider
  # through its *build* platform, and `build_platform` above cross-compiles
  # osx_arm64 from osx_64, so the osx_arm64 key would never be consulted.
  osx_64: github_actions
test: native
